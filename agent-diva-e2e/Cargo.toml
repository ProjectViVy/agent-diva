[package]
name = "agent-diva-e2e"
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
license = "MIT"
description = "End-to-end testing framework for agent-diva using real LLM calls"

[dependencies]
agent-diva-agent = { path = "../agent-diva-agent", version = "0.5.0" }
agent-diva-core = { path = "../agent-diva-core", version = "0.5.0" }
agent-diva-providers = { path = "../agent-diva-providers", version = "0.5.0" }
agent-diva-tooling = { workspace = true }
agent-diva-tools = { path = "../agent-diva-tools", version = "0.5.0" }

tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
