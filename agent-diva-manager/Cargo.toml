[package]
name = "agent-diva-manager"
version = "0.9.9"
edition = "2021"
authors = ["mastwet (projectViVY Team, undefine foundation)"]
license = "MIT"
repository = "https://github.com/ProjectViVy/agent-diva"
description = "Manager server for Agent Diva"
rust-version = "1.80.0"

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
zip = "0.6"
chrono = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

# Internal dependencies
agent-diva-core = { path = "../agent-diva-core", version = "0.9.9" }
agent-diva-agent = { path = "../agent-diva-agent", version = "0.9.9" }
agent-diva-providers = { path = "../agent-diva-providers", version = "0.9.9" }
agent-diva-channels = { path = "../agent-diva-channels", version = "0.9.9" }
agent-diva-tools = { path = "../agent-diva-tools", version = "0.9.9" }
agent-diva-sandbox = { path = "../agent-diva-sandbox", version = "0.9.9" }
agent-diva-files = { path = "../agent-diva-files", version = "0.9.9" }
agent-diva-autodream = { path = "../agent-diva-autodream", version = "0.9.9" }
agent-diva-laputa = { path = "../agent-diva-laputa", version = "0.9.9" }
mime_guess = "2.0"
base64.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = { workspace = true }
tokio-tungstenite = "0.24"
