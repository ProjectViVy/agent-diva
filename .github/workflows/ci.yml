name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
    paths:
      - 'agent-diva-gui/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agent-diva-gui/**'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

permissions:
  contents: read

# Post wire-cut (DN-W): the Rust workspace and Tauri backend are removed.
# The remaining gate is the Vue frontend test + build. The new product
# build/package contract returns in DN-8 (docs/plans/diva-next/index.md).
jobs:
  gui-check:
    name: GUI Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: agent-diva-gui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: agent-diva-gui
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: agent-diva-gui
        run: pnpm test

      - name: Build
        working-directory: agent-diva-gui
        run: pnpm build
