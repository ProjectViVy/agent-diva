name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
    paths:
      - 'agent-diva-gui/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'agent-diva-gui/**'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

permissions:
  contents: read

# DN-5 adds the thin-shell gate: vivy-bridge is pure Rust with no webkit
# dependency, so its FFI tests run in CI. The Tauri shell crate itself
# (webkit2gtk, bundling) is verified on native runners per the plan.
jobs:
  gui-check:
    name: GUI Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: agent-diva-gui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: agent-diva-gui
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: agent-diva-gui
        run: pnpm test

      - name: Build
        working-directory: agent-diva-gui
        run: pnpm build

  shell-bridge-check:
    name: vivy-bridge FFI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-diva-gui/src-tauri
      - name: Bridge FFI tests
        working-directory: agent-diva-gui/src-tauri
        run: cargo test -p vivy-bridge
