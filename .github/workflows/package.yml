name: Package matched Windows desktop
on:
  workflow_dispatch:
    inputs:
      core_artifact_url:
        description: HTTPS ZIP URL of a complete matched core artifact
        required: true
      core_artifact_sha256:
        description: SHA256 of that ZIP
        required: true
permissions:
  contents: read
jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Download and verify explicit core artifact
        shell: pwsh
        env:
          CORE_URL: ${{ inputs.core_artifact_url }}
          CORE_SHA256: ${{ inputs.core_artifact_sha256 }}
        run: |
          if (([Uri]$env:CORE_URL).Scheme -ne 'https') { throw 'HTTPS artifact URL required' }
          Invoke-WebRequest -Uri $env:CORE_URL -OutFile core.zip
          if ((Get-FileHash core.zip -Algorithm SHA256).Hash -ne $env:CORE_SHA256) { throw 'Core ZIP checksum mismatch' }
          Expand-Archive -LiteralPath core.zip -DestinationPath core
      - run: npm ci
      - run: npm run import-core -- core
      - run: npm test
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: agent-diva-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
