[package]
name = "agent-diva-shell"
version = "0.4.10"
edition = "2021"
description = "DIVA Next Tauri thin shell over the sealed VIVY shared library"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "agent_diva_shell"

[workspace]
members = ["crates/vivy-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vivy-bridge = { path = "crates/vivy-bridge" }

[dev-dependencies]
tempfile = "3"
